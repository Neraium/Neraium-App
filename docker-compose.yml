version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb+srv://neraiumai_db_user:QryIJHbd7tfPkVTO@cluster0.ftl67pd.mongodb.net/?retryWrites=true&w=majority}
      DB_NAME: ${DB_NAME:-neraium_demo}
      CORS_ORIGINS: "http://localhost:3000"
    command: uvicorn backend.server:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8000
    depends_on:
      - backend
