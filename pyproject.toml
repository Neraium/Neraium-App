[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neraium-historical-workbench"
version = "0.2.0"
description = "Internal historical telemetry evaluation workflow consuming authoritative Neraium-1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.7,<3", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
include = ["backend", "backend.workbench", "backend.workbench.*"]
namespaces = true

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
