[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neraium-core"
version = "0.1.0"
description = "Read-only structural intelligence engine with Grow as the default cultivation runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
  "motor>=3.3.0",
  "python-dotenv>=1.0.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "matplotlib>=3.5",
]

[tool.setuptools]
packages = ["neraium_core", "backend"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pandas>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
